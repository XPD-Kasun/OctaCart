# Build and test front-end merchant app
name: Build Frontend

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["github-actions-setup"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

jobs:
  # Build job
  build:
    defaults:
      run:
        working-directory: ./front
        
    runs-on: ubuntu-latest
    
    permissions:
      checks: write
      contents: read
    
    steps:    
      - name: Checkout
        uses: actions/checkout@v7
     
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          version: ^12.0.0
          working-directory: ./front
          install: true
          require-lockfile: true
          
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          # Generate a new cache whenever packages or source files change.
          key:  ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
        
      - name: Build with Next.js
        run: pnpm run build            

      - name: Test Nextjs frontend
        run: pnpm run test

      - name: Prepare Standalone Deployment Directory 
        run: |
          # 1. Copy the standalone bundle
          cp -r .next/standalone ./dist-standalone
          
          # 2. Copy static files & public
          mkdir -p ./dist-standalone/.next/static
          cp -r .next/static/* ./dist-standalone/.next/static/
          if [ -d "public" ]; then
            cp -r public ./dist-standalone/public
          fi

          # 3. FIX: Copy missing @swc/helpers into the standalone node_modules
          mkdir -p ./dist-standalone/node_modules/@swc
          cp -r node_modules/@swc/helpers ./dist-standalone/node_modules/@swc/

      - name: Upload Build Dists
        uses: actions/upload-artifact@v7
        with:
          name: Nextjs-App
          path: ./dist-standalone

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: Nextjs-App
          path: ./front/artifacts
        
