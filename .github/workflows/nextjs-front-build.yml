# Build and test front-end merchant app
name: Build Frontend

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["github-actions-setup"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

jobs:
  # Build job
  build:
    defaults:
      run:
        working-directory: ./front
        
    runs-on: ubuntu-latest
    
    permissions:
      checks: write
      contents: read
    
    steps:    
      - name: Checkout
        uses: actions/checkout@v4
     
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          version: ^12.0.0
          working-directory: ./front
          install: true
          require-lockfile: true
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          # Generate a new cache whenever packages or source files change.
          key:  ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
        
      - name: Build with Next.js
        run: pnpm run build
            
      - name: SSH
        uses: mxschmitt/action-tmate@v3
        with:
          sudo: false

      - name: Test Nextjs frontend
        run: pnpm run test

      - name: Upload Build Dist
        uses: actions/upload-artifact@v7
        with:
          name: Nextjs-App
          path: |
            ./frontend/.next/standalone
            ./frontend/.next/static
            ./frontend/public

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: Nextjs-App
          path: ./frontend/artifacts
        
