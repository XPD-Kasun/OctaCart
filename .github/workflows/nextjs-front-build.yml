# Build and test front-end merchant app
name: Build Frontend

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["github-actions-setup"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build job
  build:
    defaults:
      run:
        working-directory: ./front

    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Verify package-lock.json is in sync with package.json
        run: |
          npm install --package-lock-only
          if ! git diff --quiet -- package-lock.json; then
            echo "Error > package-lock.json is out of date. Run 'npm install --package-lock-only' in ./front and commit the result."
            git diff -- package-lock.json
            exit 1
          fi


      - name: Install npm dependencies
        run: npm ci

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/front/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-${{ hashFiles('front/**.[jt]s', 'front/**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-

      - name: Build with Next.js
        run: npm run build

      - name: Test Nextjs frontend
        run: npm test

      - name: Prepare Standalone Deployment Directory
        run: |
          # 1. Copy the standalone bundle
          cp -r ./.next/standalone ./dist-standalone

          # 2. Copy static files & public
          mkdir -p ./dist-standalone/.next/static
          cp -r ./.next/static/* ./dist-standalone/.next/static/
          if [ -d "public" ]; then
            cp -r public ./dist-standalone/public
          fi

          echo "dist-standalone"
          ls ./dist-standalone -la
          echo "dist-standalone/.next"
          ls ./dist-standalone/.next -la
          echo "dist-standalone/.next/static"
          ls ./dist-standalone/.next/static -la

      - name: Upload Build Dists
        uses: actions/upload-artifact@v7
        with:
          name: Nextjs-App
          path: ./front/dist-standalone
          include-hidden-files: true

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: Nextjs-App
          path: ./front/artifacts